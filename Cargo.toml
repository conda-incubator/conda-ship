[workspace]
members = ["."]
default-members = ["."]

[package]
name = "conda-ship"
version = "0.9.0"
edition = "2024"
description = "Build ready-to-run conda runtimes"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/jezdez/conda-ship"
homepage = "https://jezdez.github.io/conda-ship/"
documentation = "https://jezdez.github.io/conda-ship/"
keywords = ["conda", "bootstrap", "installer", "runtime"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pixi.toml",
  "/pyproject.toml",
  "/python/conda_ship/*.py",
  "/README.md",
  "/src/*.rs",
  "/src/bin/*.rs",
  "/src/bin/cs/*.rs",
  "/src/snapshots/*.snap",
  "/tests/*.rs",
  "/tests/snapshots/*.snap",
]
publish = false
default-run = "cs"

[[bin]]
name = "cs-template"
path = "src/main.rs"
required-features = ["runtime-template"]

[[bin]]
name = "cs"
path = "src/bin/cs.rs"

[features]
default = ["rustls-tls"]
fleet = []
native-tls = [
  "reqwest/native-tls",
  "rattler/native-tls",
  "rattler_networking/native-tls",
  "rattler_cache/native-tls",
]
rustls-tls = [
  "dep:rustls",
  "reqwest/rustls-no-provider",
  "rustls/ring",
]
online_tests = []
runtime-template = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
dirs = "6"
futures = "0.3"
fs4 = "1.1"
indicatif = "0.18"
jiff = { version = "0.2", default-features = false, features = ["std"] }
miette = { version = "7.6", features = ["fancy"] }
object = { version = "0.37", default-features = false, features = [
  "macho",
  "pe",
  "read_core",
  "std",
  "unaligned",
] }
rattler = { version = "0.48.1", default-features = false, features = ["indicatif"] }
rattler_cache = { version = "0.10", default-features = false }
rattler_conda_types = { version = "0.49", default-features = false }
rattler_lock = { version = "=0.32.0", default-features = false }
rattler_networking = { version = "0.30", default-features = false }
rattler_package_streaming = { version = "0.26", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
same-file = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
toml = "1.1"
tar = "0.4"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Threading",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
rstest = "0.26"
temp-env = "0.3"
