[workspace]
name = "conda-ship"
description = "Build ready-to-run conda runtimes"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64", "win-arm64"]
license = "BSD-3-Clause"

[dependencies]
rust = ">=1.85"

[target.linux.dependencies]
cargo-llvm-cov = ">=0.6"
sccache = ">=0.10"

[target.linux.activation.env]
RUSTC_WRAPPER = "sccache"

[target.osx.dependencies]
cargo-llvm-cov = ">=0.6"
sccache = ">=0.10"

[target.osx.activation.env]
RUSTC_WRAPPER = "sccache"

[target.win-64.dependencies]
cargo-llvm-cov = ">=0.6"
sccache = ">=0.10"

[target.win-64.activation.env]
RUSTC_WRAPPER = "sccache"

[tasks]
build = "cargo build --release --bin cs"
build-debug = "cargo build --bin cs"
check-lock = "cargo run -p conda-ship -- inspect --json > /dev/null"
test = "cargo test --release --features runtime-template,fleet"
test-all = "cargo test --release --features runtime-template,fleet,online_tests"
coverage = "mkdir -p target/coverage && cargo llvm-cov --locked --features runtime-template,fleet --lcov --output-path target/coverage/rust.lcov"
coverage-html = "cargo llvm-cov --locked --features runtime-template,fleet --html"
fmt-check = "cargo fmt --check"
clippy = "cargo clippy --all-targets --features runtime-template,fleet -- -D warnings"
demos = { cmd = """bash -c 'if [ -n "$1" ]; then vhs "demos/$1.tape"; else for tape in demos/*.tape; do [[ "$(basename "$tape")" == _* ]] && continue; vhs "$tape"; done; fi' -- {{ name }}""", args = [{ arg = "name", default = "" }], description = "Record demo GIFs" }

[feature.lint]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[feature.lint.dependencies]
prek = ">=0.4.4"

[feature.lint.tasks]
lint = "prek run --all-files"

[feature.sbom]
platforms = ["linux-aarch64"]

[feature.sbom.dependencies]
cyclonedx-cli = ">=0.33.1,<0.34"

[feature.docs]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[feature.docs.dependencies]
sphinx = ">=7.0"
conda-sphinx-theme = ">=0.2"
myst-parser = ">=3.0"
sphinx-design = ">=0.6"
sphinx-copybutton = ">=0.5"
sphinxcontrib-mermaid = ">=1.0"
sphinx-sitemap = ">=2.5"

[feature.docs.tasks]
docs = { cmd = "sphinx-build -b dirhtml . _build/dirhtml", cwd = "docs" }
docs-serve = { cmd = "python -m http.server", cwd = "docs/_build/dirhtml" }
docs-clean = { cmd = "rm -rf _build", cwd = "docs" }

[feature.ship]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[feature.ship.dependencies]
python = ">=3.12"
conda = ">=25.1"
conda-rattler-solver = "*"
conda-spawn = ">=0.1.0"

[feature.test]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[feature.test.dependencies]
python = ">=3.12"
python-build = ">=1.2"
conda = ">=25.1"
coverage = ">=7.10.6"
maturin = ">=1.0,<2.0"
pytest = ">=8.0"
ruff = ">=0.15"
twine = ">=6.0"

[feature.test.pypi-dependencies]
conda-ship = { path = ".", editable = true }

[feature.test.tasks]
pytest = "python -m pytest python/tests"
coverage-python = "python -m coverage erase && python -m coverage run -m pytest python/tests && python -m coverage combine && python -m coverage xml && python -m coverage report"
coverage-python-html = "python -m coverage html"
ruff-check = "ruff check python tests/ci pyproject.toml"
ruff-format-check = "ruff format --check python tests/ci pyproject.toml"

[environments]
docs = ["docs"]
lint = { features = ["lint"], no-default-feature = true }
sbom = { features = ["sbom"], no-default-feature = true }
ship = { features = ["ship"], no-default-feature = true }
test = ["test"]

[tool.conda-ship]
source-environment = "ship"
runtime-version = "0.1.0"
exclude-packages = ["conda-libmamba-solver"]
