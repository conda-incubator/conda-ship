name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/canary.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "prek.toml"
      - "action.yml"
      - "CHANGELOG.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pixi.toml"
      - "pixi.lock"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/canary.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "prek.toml"
      - "action.yml"
      - "CHANGELOG.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pixi.toml"
      - "pixi.lock"
      - "pyproject.toml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and smoke runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      TARGET: ${{ matrix.target }}
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true

      - name: Verify runner target
        shell: bash
        run: |
          set -euo pipefail

          host="$(pixi run -- rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$TARGET" ]; then
            echo "Expected runner target ${TARGET}, got ${host}" >&2
            exit 1
          fi

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build cs CLI
        run: pixi run -- cargo rustc --locked --release --bin cs -- -D warnings

      - name: Check update packaging command
        shell: bash
        run: |
          cs="./target/release/cs"
          if [[ "$TARGET" == *"windows"* ]]; then
            cs="${cs}.exe"
          fi
          "$cs" package-update --help >/dev/null

      - name: Test
        run: pixi run --locked test

      - name: Build runtime template
        run: pixi run -- cargo rustc --locked --release --bin cs-template --features runtime-template -- -D warnings

      - name: Build smoke runtime
        shell: bash
        run: |
          cs="./target/release/cs"
          template="./target/release/cs-template"
          if [[ "$TARGET" == *"windows"* ]]; then
            cs="${cs}.exe"
            template="${template}.exe"
          fi
          "$cs" build \
            --artifact-layout online \
            --runtime-name demo \
            --delegate-executable conda \
            --target "$TARGET" \
            --target-label "$TARGET" \
            --template "$template"

      - name: Validate CycloneDX SBOM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: >-
          pixi run --locked -e sbom cyclonedx-cli validate
          --input-file "dist/demo-${TARGET}.cdx.json"
          --input-format json
          --input-version v1_7
          --fail-on-errors

      - name: Smoke test built runtime
        shell: bash
        run: |
          if [[ "$TARGET" == *"windows"* ]]; then
            BIN="./dist/demo-${TARGET}.exe"
          else
            BIN="./dist/demo-${TARGET}"
          fi
          DEMO_PREFIX="$RUNNER_TEMP/demo-smoke" "$BIN" info --json
          DEMO_PREFIX="$RUNNER_TEMP/demo-smoke" "$BIN" list --json

      - name: Build embedded bundle
        shell: bash
        run: |
          cs="./target/release/cs"
          template="./target/release/cs-template"
          if [[ "$TARGET" == *"windows"* ]]; then
            cs="${cs}.exe"
            template="${template}.exe"
          fi
          "$cs" build \
            --artifact-layout embedded \
            --runtime-name demo \
            --artifact-name demoz \
            --delegate-executable conda \
            --target "$TARGET" \
            --target-label "$TARGET" \
            --template "$template"

      - name: Verify published artifact manifests
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          for manifest in "demo-${TARGET}.sha256" "demoz-${TARGET}.sha256"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check "$manifest"
            else
              shasum --algorithm 256 --check "$manifest"
            fi
          done

      - name: Verify macOS runtime signatures
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail

          cs="./target/release/cs"

          for name in demo demoz; do
            binary="./dist/${name}-${TARGET}"
            codesign --verify --deep --strict --verbose=4 "$binary"
            resigned="${RUNNER_TEMP}/${name}-${TARGET}-resigned"
            cp "$binary" "$resigned"
            codesign --force --sign - "$resigned"
            codesign --verify --deep --strict --verbose=4 "$resigned"

            tampered="${RUNNER_TEMP}/${name}-${TARGET}-tampered"
            cp "$resigned" "$tampered"
            python3 - "$tampered" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "r+b") as file:
              header = file.read(32)
              if len(header) != 32 or struct.unpack_from("<I", header)[0] != 0xFEEDFACF:
                  raise SystemExit("expected a little-endian 64-bit Mach-O runtime")
              command_count = struct.unpack_from("<I", header, 16)[0]
              command_size = struct.unpack_from("<I", header, 20)[0]
              commands = file.read(command_size)
              cursor = 0
              signature_offset = None
              for _ in range(command_count):
                  if cursor + 8 > len(commands):
                      raise SystemExit("Mach-O load command is truncated")
                  command, size = struct.unpack_from("<II", commands, cursor)
                  if size < 8 or cursor + size > len(commands):
                      raise SystemExit("Mach-O load command has an invalid size")
                  if command == 0x1D:
                      if size != 16:
                          raise SystemExit("LC_CODE_SIGNATURE has an invalid size")
                      signature_offset = struct.unpack_from("<I", commands, cursor + 8)[0]
                      break
                  cursor += size
              if signature_offset is None:
                  raise SystemExit("LC_CODE_SIGNATURE was not found")
              file.seek(0)
              signed_data = file.read(signature_offset)
              footer_magic = signed_data.rfind(b"CONDA_SHIP_V0001")
              if footer_magic < 0:
                  raise SystemExit("conda-ship runtime data footer was not found")
              file.seek(footer_magic)
              value = file.read(1)
              if len(value) != 1:
                  raise SystemExit("conda-ship runtime data footer is truncated")
              file.seek(footer_magic)
              file.write(bytes([value[0] ^ 1]))
          PY
            if codesign --verify --deep --strict "$tampered" 2>/dev/null; then
              echo "codesign accepted modified runtime data in ${tampered}" >&2
              exit 1
            fi

            shadow="${RUNNER_TEMP}/${name}-${TARGET}-shadow"
            shadow_info="${RUNNER_TEMP}/${name}-${TARGET}-shadow.info.json"
            cp "$resigned" "$shadow"
            python3 - \
              "$shadow" \
              "./dist/${name}-${TARGET}.info.json" \
              "$shadow_info" <<'PY'
          import hashlib
          import json
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "r+b") as file:
              data = bytearray(file.read())
              command_count = struct.unpack_from("<I", data, 16)[0]
              command_size = struct.unpack_from("<I", data, 20)[0]
              cursor = 32
              signature_offset = None
              signature_size = None
              for _ in range(command_count):
                  if cursor + 8 > 32 + command_size:
                      raise SystemExit("Mach-O load command is truncated")
                  command, size = struct.unpack_from("<II", data, cursor)
                  if size < 8 or cursor + size > 32 + command_size:
                      raise SystemExit("Mach-O load command has an invalid size")
                  if command == 0x1D:
                      signature_offset, signature_size = struct.unpack_from(
                          "<II", data, cursor + 8
                      )
                      break
                  cursor += size
              if signature_offset is None:
                  raise SystemExit("LC_CODE_SIGNATURE was not found")

              footer_end = None
              magic = b"CONDA_SHIP_V0001"
              for padding in range(16):
                  candidate = signature_offset - padding
                  if data[candidate - len(magic):candidate] == magic:
                      if any(data[candidate:signature_offset]):
                          raise SystemExit("runtime footer alignment padding is not zero")
                      footer_end = candidate
                      break
              if footer_end is None:
                  raise SystemExit("anchored conda-ship footer was not found")
              footer_start = footer_end - 100
              header_length, bundle_length = struct.unpack_from(
                  "<QQ", data, footer_start
              )
              header_start = footer_start - header_length - bundle_length
              header = json.loads(data[header_start:header_start + header_length])
              header["runtime_name"] = "forged"
              header["runtime_lock"] = ""
              header["runtime_config"] = {
                  "channels": [],
                  "packages": [],
                  "freeze_base": False,
              }
              forged_header = json.dumps(
                  header, separators=(",", ":"), ensure_ascii=False
              ).encode()
              forged = b"".join((
                  forged_header,
                  struct.pack("<QQ", len(forged_header), 0),
                  hashlib.sha256(forged_header).digest(),
                  hashlib.sha256(b"").digest(),
                  struct.pack("<I", 1),
                  magic,
              ))

              if struct.unpack_from(">I", data, signature_offset)[0] != 0xFADE0CC0:
                  raise SystemExit("code-signing SuperBlob was not found")
              superblob_length = struct.unpack_from(">I", data, signature_offset + 4)[0]
              forged_offset = signature_offset + superblob_length
              signature_end = signature_offset + signature_size
              if forged_offset + len(forged) > signature_end:
                  raise SystemExit("code-signature padding is too small for forged stamp")
              data[forged_offset:forged_offset + len(forged)] = forged
              file.seek(0)
              file.write(data)

          with open(sys.argv[2], encoding="utf-8") as file:
              info = json.load(file)
          info["update"] = {
              "channel": "https://packages.example.test/runtime",
              "package": "demo-runtime",
              "build-number": 0,
          }
          with open(sys.argv[3], "w", encoding="utf-8") as file:
              json.dump(info, file)
          PY
            codesign --verify --deep --strict --verbose=4 "$shadow"

            package_dir="${RUNNER_TEMP}/${name}-${TARGET}-shadow-package"
            mkdir "$package_dir"
            set +e
            package_output="$($cs package-update \
              --info "$shadow_info" \
              --binary "$shadow" \
              --out-dir "$package_dir" 2>&1)"
            package_status=$?
            set -e
            if [ "$package_status" -eq 0 ] || \
              ! grep -Fq \
                "runtime executable update configuration does not match artifact info" \
                <<<"$package_output"; then
              printf '%s\n' "$package_output" >&2
              echo "reader did not retain the authenticated runtime stamp" >&2
              exit 1
            fi
          done

      - name: Verify Windows runtime signature coverage
        if: contains(matrix.target, 'windows-msvc')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-ByteRange {
            param(
              [byte[]]$Bytes,
              [long]$Offset,
              [long]$Length
            )
            if (
              $Offset -lt 0 -or
              $Length -lt 0 -or
              $Offset + $Length -gt $Bytes.LongLength -or
              $Offset -gt [int]::MaxValue -or
              $Length -gt [int]::MaxValue
            ) {
              throw "Byte range is outside the PE file"
            }
            $result = [byte[]]::new([int]$Length)
            [Buffer]::BlockCopy($Bytes, [int]$Offset, $result, 0, [int]$Length)
            return ,$result
          }

          function Flip-FileByte {
            param(
              [string]$Path,
              [long]$Offset
            )
            $stream = [System.IO.File]::Open(
              $Path,
              [System.IO.FileMode]::Open,
              [System.IO.FileAccess]::ReadWrite
            )
            try {
              $stream.Position = $Offset
              $value = $stream.ReadByte()
              if ($value -lt 0) {
                throw "Mutation offset is outside the PE file"
              }
              $stream.Position = $Offset
              $stream.WriteByte($value -bxor 1)
            }
            finally {
              $stream.Dispose()
            }
          }

          function Assert-RuntimeReadFailure {
            param(
              [string]$Binary,
              [string]$Info,
              [string]$Expected,
              [string]$Label
            )
            $packageDir = Join-Path $env:RUNNER_TEMP (
              "runtime-read-$([guid]::NewGuid())"
            )
            New-Item -ItemType Directory -Path $packageDir | Out-Null
            $output = & ".\target\release\cs.exe" package-update `
              --info $Info `
              --binary $Binary `
              --out-dir $packageDir 2>&1 | Out-String
            $status = $LASTEXITCODE
            if ($status -eq 0 -or $output -notmatch [regex]::Escape($Expected)) {
              throw "$Label was not rejected as expected: $output"
            }
          }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe was not found"
          }

          $subject = "CN=conda-ship CI $([guid]::NewGuid())"
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable
          $trustedCertificate = $null
          try {
            $trustedCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificate.RawData
            )
            $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              "Root",
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )
            try {
              $rootStore.Open(
                [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
              )
              $rootStore.Add($trustedCertificate)
            }
            finally {
              $rootStore.Close()
            }

            foreach ($name in @("demo", "demoz")) {
              $source = Join-Path "dist" "${name}-${env:TARGET}.exe"
              $signed = Join-Path $env:RUNNER_TEMP "${name}-${env:TARGET}-signed.exe"
              Copy-Item $source $signed
              $unsignedLength = (Get-Item $signed).Length
              if ($unsignedLength % 8 -ne 0) {
                throw "Stamped PE runtime is not 8-byte aligned"
              }

              $bytes = [System.IO.File]::ReadAllBytes($signed)
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
              $sectionCount = [BitConverter]::ToUInt16($bytes, $peOffset + 6)
              $optionalSize = [BitConverter]::ToUInt16($bytes, $peOffset + 20)
              $sectionOffset = $peOffset + 24 + $optionalSize
              $lastSectionEnd = 0L
              $anchorCount = 0
              $anchorOffset = 0L
              $anchorRawSize = 0L
              for ($index = 0; $index -lt $sectionCount; $index++) {
                $entry = $sectionOffset + 40 * $index
                $sectionName = [Text.Encoding]::ASCII.GetString(
                  (Get-ByteRange $bytes $entry 8)
                ).TrimEnd([char]0)
                $virtualSize = [BitConverter]::ToUInt32($bytes, $entry + 8)
                $rawSize = [BitConverter]::ToUInt32($bytes, $entry + 16)
                $rawOffset = [BitConverter]::ToUInt32($bytes, $entry + 20)
                $lastSectionEnd = [Math]::Max($lastSectionEnd, [long]$rawOffset + $rawSize)
                if ($sectionName -eq ".cship") {
                  $anchorCount += 1
                  $anchorOffset = $rawOffset
                  $anchorRawSize = $rawSize
                  $characteristics = [BitConverter]::ToUInt32($bytes, $entry + 36)
                  if ($virtualSize -ne 100 -or $characteristics -ne 0x40000040) {
                    throw "The .cship section does not have its canonical layout"
                  }
                }
              }
              if ($anchorCount -ne 1) {
                throw "Expected exactly one .cship section"
              }
              $anchorEnd = $anchorOffset + $anchorRawSize
              if ($anchorEnd -ne $lastSectionEnd) {
                throw "The .cship section is not the final raw PE section"
              }
              $footerMagic = [Text.Encoding]::ASCII.GetString(
                (Get-ByteRange $bytes ($anchorOffset + 84) 16)
              )
              if ($footerMagic -ne "CONDA_SHIP_V0001") {
                throw "The .cship section does not contain a runtime footer"
              }
              for ($offset = $anchorOffset + 100; $offset -lt $anchorEnd; $offset++) {
                if ($bytes[$offset] -ne 0) {
                  throw "The .cship section padding is not zero"
                }
              }

              $headerLength = [BitConverter]::ToUInt64($bytes, [int]$anchorOffset)
              $bundleLength = [BitConverter]::ToUInt64($bytes, [int]$anchorOffset + 8)
              $contentLength = [uint64]($headerLength + $bundleLength)
              $unalignedEnd = [uint64]($anchorEnd + $contentLength)
              $payloadPadding = [uint64]((8 - ($unalignedEnd % 8)) % 8)
              $payloadStart = [uint64]($anchorEnd + $payloadPadding)
              $payloadEnd = [uint64]($payloadStart + $contentLength)
              if ($payloadEnd -ne $unsignedLength) {
                throw "The PE runtime payload does not end at unsigned EOF"
              }
              for ($offset = $anchorEnd; $offset -lt $payloadStart; $offset++) {
                if ($bytes[$offset] -ne 0) {
                  throw "The PE runtime alignment padding is not zero"
                }
              }

              $headerBytes = Get-ByteRange $bytes $payloadStart $headerLength
              $expectedHeaderHash = Get-ByteRange $bytes ($anchorOffset + 16) 32
              $actualHeaderHash = [Security.Cryptography.SHA256]::HashData($headerBytes)
              if (
                [Convert]::ToHexString($actualHeaderHash) -ne
                [Convert]::ToHexString($expectedHeaderHash)
              ) {
                throw "The PE runtime header does not match the signed anchor"
              }
              $bundleBytes = Get-ByteRange `
                $bytes `
                ($payloadStart + $headerLength) `
                $bundleLength
              $expectedBundleHash = Get-ByteRange $bytes ($anchorOffset + 48) 32
              $actualBundleHash = [Security.Cryptography.SHA256]::HashData($bundleBytes)
              if (
                [Convert]::ToHexString($actualBundleHash) -ne
                [Convert]::ToHexString($expectedBundleHash)
              ) {
                throw "The PE runtime bundle does not match the signed anchor"
              }

              $attackInfo = Join-Path $env:RUNNER_TEMP (
                "${name}-${env:TARGET}-attack.info.json"
              )
              $attackInfoObject = Get-Content `
                "dist\${name}-${env:TARGET}.info.json" -Raw | ConvertFrom-Json
              $attackUpdate = [pscustomobject]@{
                channel = "https://packages.example.test/runtime"
                package = "demo-runtime"
                "build-number" = 0
              }
              $attackInfoObject.update = $attackUpdate
              [System.IO.File]::WriteAllText(
                $attackInfo,
                ($attackInfoObject | ConvertTo-Json -Compress -Depth 20),
                [Text.UTF8Encoding]::new($false)
              )

              & $signTool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint $signed
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed to sign $signed"
              }
              & $signTool.FullName verify /pa /v $signed
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed to verify $signed"
              }
              $null = & $signed --help
              if ($LASTEXITCODE -ne 0) {
                throw "The signed runtime did not execute"
              }

              $signedBytes = [System.IO.File]::ReadAllBytes($signed)
              $optionalOffset = $peOffset + 24
              $optionalMagic = [BitConverter]::ToUInt16($signedBytes, $optionalOffset)
              $dataDirectoryOffset = switch ($optionalMagic) {
                0x10b { $optionalOffset + 96 }
                0x20b { $optionalOffset + 112 }
                default { throw "Unexpected PE optional-header magic" }
              }
              $securityOffset = $dataDirectoryOffset + 8 * 4
              $certificateOffset = [BitConverter]::ToUInt32($signedBytes, $securityOffset)
              $certificateSize = [BitConverter]::ToUInt32($signedBytes, $securityOffset + 4)
              if ($certificateOffset -ne $payloadEnd) {
                throw "signtool did not place the certificate table at the runtime payload end"
              }
              if ($certificateOffset + $certificateSize -ne $signedBytes.Length) {
                throw "PE certificate table is not the final file data"
              }

              $anchorTampered = Join-Path $env:RUNNER_TEMP (
                "${name}-${env:TARGET}-tampered-anchor.exe"
              )
              Copy-Item $signed $anchorTampered
              Flip-FileByte $anchorTampered ($anchorOffset + 16)
              $null = & $signTool.FullName verify /pa $anchorTampered 2>&1
              if ($LASTEXITCODE -eq 0) {
                throw "Authenticode accepted a modified .cship anchor"
              }
              Assert-RuntimeReadFailure `
                $anchorTampered `
                $attackInfo `
                "runtime data header checksum mismatch" `
                "Modified .cship anchor"

              $payloadTampered = Join-Path $env:RUNNER_TEMP (
                "${name}-${env:TARGET}-tampered-payload.exe"
              )
              Copy-Item $signed $payloadTampered
              Flip-FileByte $payloadTampered $payloadStart
              $null = & $signTool.FullName verify /pa $payloadTampered 2>&1
              Write-Host "Overlay mutation SignTool status: $LASTEXITCODE"
              Assert-RuntimeReadFailure `
                $payloadTampered `
                $attackInfo `
                "runtime data header checksum mismatch" `
                "Modified PE overlay payload"

              $movedCertificate = Join-Path $env:RUNNER_TEMP (
                "${name}-${env:TARGET}-moved-certificate.exe"
              )
              $movedBytes = [byte[]]::new($signedBytes.Length + 8)
              [Buffer]::BlockCopy(
                $signedBytes,
                0,
                $movedBytes,
                0,
                [int]$certificateOffset
              )
              [Buffer]::BlockCopy(
                $signedBytes,
                [int]$certificateOffset,
                $movedBytes,
                [int]$certificateOffset + 8,
                [int]$certificateSize
              )
              [BitConverter]::GetBytes([uint32]($certificateOffset + 8)).CopyTo(
                $movedBytes,
                $securityOffset
              )
              [System.IO.File]::WriteAllBytes($movedCertificate, $movedBytes)
              $null = & $signTool.FullName verify /pa $movedCertificate 2>&1
              Write-Host "Moved certificate SignTool status: $LASTEXITCODE"
              Assert-RuntimeReadFailure `
                $movedCertificate `
                $attackInfo `
                "does not end at the certificate table offset" `
                "Moved PE certificate table"

              if ($name -eq "demo") {
                if ($bundleLength -ne 0) {
                  throw "The shadow test requires the online fixture"
                }
                $headerJson = [Text.Encoding]::UTF8.GetString($headerBytes)
                $forgedHeaderObject = $headerJson | ConvertFrom-Json
                $forgedHeaderObject.update = $attackUpdate
                $forgedHeaderBytes = [Text.Encoding]::UTF8.GetBytes(
                  ($forgedHeaderObject | ConvertTo-Json -Compress -Depth 20)
                )
                $forged = [byte[]]::new($forgedHeaderBytes.Length + 100)
                [Buffer]::BlockCopy(
                  $forgedHeaderBytes,
                  0,
                  $forged,
                  0,
                  $forgedHeaderBytes.Length
                )
                $cursor = $forgedHeaderBytes.Length
                [BitConverter]::GetBytes([uint64]$forgedHeaderBytes.Length).CopyTo(
                  $forged,
                  $cursor
                )
                $cursor += 8
                [BitConverter]::GetBytes([uint64]0).CopyTo($forged, $cursor)
                $cursor += 8
                [Security.Cryptography.SHA256]::HashData($forgedHeaderBytes).CopyTo(
                  $forged,
                  $cursor
                )
                $cursor += 32
                [Security.Cryptography.SHA256]::HashData([byte[]]::new(0)).CopyTo(
                  $forged,
                  $cursor
                )
                $cursor += 32
                [BitConverter]::GetBytes([uint32]1).CopyTo($forged, $cursor)
                $cursor += 4
                [Text.Encoding]::ASCII.GetBytes("CONDA_SHIP_V0001").CopyTo(
                  $forged,
                  $cursor
                )

                $extraSize = [int]($forged.Length + ((8 - ($forged.Length % 8)) % 8))
                $shadowBytes = [byte[]]::new($signedBytes.Length + $extraSize)
                [Buffer]::BlockCopy(
                  $signedBytes,
                  0,
                  $shadowBytes,
                  0,
                  $signedBytes.Length
                )
                [Buffer]::BlockCopy(
                  $forged,
                  0,
                  $shadowBytes,
                  $signedBytes.Length,
                  $forged.Length
                )
                $firstCertificateLength = [BitConverter]::ToUInt32(
                  $shadowBytes,
                  $certificateOffset
                )
                $alignedFirstCertificateLength = [uint32](
                  $firstCertificateLength +
                  ((8 - ($firstCertificateLength % 8)) % 8)
                )
                if ($alignedFirstCertificateLength -ne $certificateSize) {
                  throw "Expected one signtool WIN_CERTIFICATE record"
                }
                $shadowCertificateSize = [uint32]($certificateSize + $extraSize)
                [BitConverter]::GetBytes($shadowCertificateSize).CopyTo(
                  $shadowBytes,
                  $securityOffset + 4
                )
                [BitConverter]::GetBytes($shadowCertificateSize).CopyTo(
                  $shadowBytes,
                  $certificateOffset
                )
                $shadow = Join-Path $env:RUNNER_TEMP (
                  "${name}-${env:TARGET}-certificate-shadow.exe"
                )
                [System.IO.File]::WriteAllBytes($shadow, $shadowBytes)

                & $signTool.FullName verify /pa /v $shadow
                if ($LASTEXITCODE -ne 0) {
                  throw "signtool rejected the certificate-padding shadow fixture"
                }
                Assert-RuntimeReadFailure `
                  $shadow `
                  $attackInfo `
                  "runtime executable update configuration does not match artifact info" `
                  "Certificate-padding shadow footer"
              }
            }
          }
          finally {
            if ($trustedCertificate) {
              $trustedCertificate.Dispose()
            }
            Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" `
              -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\Root\$($certificate.Thumbprint)" `
              -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test embedded bundle
        shell: bash
        run: |
          if [[ "$TARGET" == *"windows"* ]]; then
            BIN="./dist/demoz-${TARGET}.exe"
          else
            BIN="./dist/demoz-${TARGET}"
          fi
          DEMO_PREFIX="$RUNNER_TEMP/demoz-smoke" "$BIN" info --json
          DEMO_PREFIX="$RUNNER_TEMP/demoz-smoke" "$BIN" list --json

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    environment: codecov
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Generate coverage
        run: pixi run coverage

      - name: Check Codecov token
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Codecov
        if: steps.codecov-token.outputs.has_token == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: test
          cache: true

      - name: Test Python package
        run: pixi run --locked -e test pytest

      - name: Check Python package
        run: |
          pixi run --locked -e test ruff-check
          pixi run --locked -e test ruff-format-check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: docs
          cache: true

      - name: Build documentation with warnings denied
        run: >-
          pixi run --locked -e docs
          sphinx-build -W -b dirhtml docs docs/_build/dirhtml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Check runtime lock derivation
        run: pixi run --locked check-lock

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git diff-tree --check --root "$GITHUB_SHA"
          fi

      - name: Lint
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.4"
