name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/canary.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "prek.toml"
      - "action.yml"
      - "CHANGELOG.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pixi.toml"
      - "pixi.lock"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/canary.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "prek.toml"
      - "action.yml"
      - "CHANGELOG.md"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pixi.toml"
      - "pixi.lock"
      - "pyproject.toml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and smoke runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      TARGET: ${{ matrix.target }}
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true

      - name: Verify runner target
        shell: bash
        run: |
          set -euo pipefail

          host="$(pixi run -- rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$TARGET" ]; then
            echo "Expected runner target ${TARGET}, got ${host}" >&2
            exit 1
          fi

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build cs CLI
        run: pixi run -- cargo rustc --locked --release --bin cs -- -D warnings

      - name: Check update packaging command
        shell: bash
        run: |
          cs="./target/release/cs"
          if [[ "$TARGET" == *"windows"* ]]; then
            cs="${cs}.exe"
          fi
          "$cs" package-update --help >/dev/null

      - name: Test
        run: pixi run --locked test

      - name: Build runtime template
        run: pixi run -- cargo rustc --locked --release --bin cs-template --features runtime-template -- -D warnings

      - name: Build smoke runtime
        shell: bash
        run: |
          cs="./target/release/cs"
          template="./target/release/cs-template"
          if [[ "$TARGET" == *"windows"* ]]; then
            cs="${cs}.exe"
            template="${template}.exe"
          fi
          "$cs" build \
            --artifact-layout online \
            --runtime-name demo \
            --delegate-executable conda \
            --target "$TARGET" \
            --target-label "$TARGET" \
            --template "$template"

      - name: Validate CycloneDX SBOM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: >-
          pixi run --locked -e sbom cyclonedx-cli validate
          --input-file "dist/demo-${TARGET}.cdx.json"
          --input-format json
          --input-version v1_7
          --fail-on-errors

      - name: Smoke test built runtime
        shell: bash
        run: |
          if [[ "$TARGET" == *"windows"* ]]; then
            BIN="./dist/demo-${TARGET}.exe"
          else
            BIN="./dist/demo-${TARGET}"
          fi
          DEMO_PREFIX="$RUNNER_TEMP/demo-smoke" "$BIN" info --json
          DEMO_PREFIX="$RUNNER_TEMP/demo-smoke" "$BIN" list --json

      - name: Build embedded bundle
        shell: bash
        run: |
          cs="./target/release/cs"
          template="./target/release/cs-template"
          if [[ "$TARGET" == *"windows"* ]]; then
            cs="${cs}.exe"
            template="${template}.exe"
          fi
          "$cs" build \
            --artifact-layout embedded \
            --runtime-name demo \
            --artifact-name demoz \
            --delegate-executable conda \
            --target "$TARGET" \
            --target-label "$TARGET" \
            --template "$template"

      - name: Verify published artifact manifests
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          for manifest in "demo-${TARGET}.sha256" "demoz-${TARGET}.sha256"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check "$manifest"
            else
              shasum --algorithm 256 --check "$manifest"
            fi
          done

      - name: Verify macOS runtime signatures
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          python3 tests/ci/verify_macos_runtime_signatures.py \
            --cs ./target/release/cs \
            --dist-dir ./dist \
            --target "$TARGET" \
            --temp-dir "$RUNNER_TEMP"

      - name: Verify Windows runtime signature coverage
        if: contains(matrix.target, 'windows-msvc')
        timeout-minutes: 10
        shell: powershell
        run: |
          ./tests/ci/verify_windows_runtime_signatures.ps1 `
            -Target $env:TARGET `
            -TemporaryDirectory $env:RUNNER_TEMP `
            -RuntimePrefix (Join-Path $env:RUNNER_TEMP "demo-smoke") `
            -DistDirectory ./dist `
            -CsExecutable ./target/release/cs.exe

      - name: Smoke test embedded bundle
        shell: bash
        run: |
          if [[ "$TARGET" == *"windows"* ]]; then
            BIN="./dist/demoz-${TARGET}.exe"
          else
            BIN="./dist/demoz-${TARGET}"
          fi
          DEMO_PREFIX="$RUNNER_TEMP/demoz-smoke" "$BIN" info --json
          DEMO_PREFIX="$RUNNER_TEMP/demoz-smoke" "$BIN" list --json

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    environment: codecov
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Generate coverage
        run: pixi run coverage

      - name: Check Codecov token
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Codecov
        if: steps.codecov-token.outputs.has_token == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: test
          cache: true

      - name: Test Python package
        run: pixi run --locked -e test pytest

      - name: Check Python package
        run: |
          pixi run --locked -e test ruff-check
          pixi run --locked -e test ruff-format-check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: docs
          cache: true

      - name: Build documentation with warnings denied
        run: >-
          pixi run --locked -e docs
          sphinx-build -W -b dirhtml docs docs/_build/dirhtml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Check runtime lock derivation
        run: pixi run --locked check-lock

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git diff-tree --check --root "$GITHUB_SHA"
          fi

      - name: Lint
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.4"
